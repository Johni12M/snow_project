baseURL = "https://johni12.github.io/snow_project/"
title = "Snow Project"
defaultContentLanguage = "de"
languageCode = "de"

[module]
  [[module.imports]]
    path = "github.com/gethinode/hinode"
  [[module.imports]]
    path = "github.com/gethinode/mod-flexsearch/v3"

[languages]
  [languages.de]
    languageName = "Deutsch"
    weight = 1
    contentDir = "content/de"

[params.favicon]
  logo = "logo.png"

[params.navigation]
  anchor = true
  logo = "/img/logo.svg"
  logo-height = 50
  logo-mode = true

[params.cards]
  summaryLength = 70

[params.style]
  primary = "#0d6efd"
  custom = "scss/custom.css"

[params.search]
  enable = true
  icon = "fas magnifying-glass"
  modal = false
  frontmatter = true


